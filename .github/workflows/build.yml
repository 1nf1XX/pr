name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare Sources & Generate Xcode Project
        run: |
          mkdir -p Sources
          mv *.swift Sources/ContentView.swift || true

          cat << 'EOF' > project.yml
          name: LupinApp
          options:
            bundleIdPrefix: com.lupin
            xcodeVersion: "15.0"
            deploymentTarget:
              iOS: "16.0"
          targets:
            LupinApp:
              type: application
              platform: iOS
              sources: [Sources]
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.lupin.app
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGNING_REQUIRED: NO
                DEVELOPMENT_TEAM: ""
                PROVISIONING_PROFILE_SPECIFIER: ""
          EOF

          xcodegen generate

      - name: Build App with Xcodebuild
        run: |
          xcodebuild -project LupinApp.xcodeproj \
            -scheme LupinApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ACTUALLY_ENABLED=NO

          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/LupinApp.app Payload/
          zip -r LupinApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LupinApp-Unsigned
          path: LupinApp.ipa
