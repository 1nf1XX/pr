name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Create Swift Package Structure
        run: |
          mkdir -p LupinApp/Sources
          # Автоматически находит любой .swift файл в корне и переносит его
          mv *.swift LupinApp/Sources/ContentView.swift
          
          cat << 'EOF' > LupinApp/Package.swift
          // swift-tools-version:5.9
          import PackageDescription

          let package = Package(
              name: "LupinApp",
              platforms: [.iOS(.v16)],
              products: [.executable(name: "LupinApp", targets: ["LupinApp"])],
              targets: [.target(name: "LupinApp", path: "Sources")]
          )
          EOF

      - name: Build App Payload
        run: |
          cd LupinApp
          swift build -c release --triple arm64-apple-ios16.0
          mkdir -p Payload/LupinApp.app
          cp .build/arm64-apple-ios16.0/release/LupinApp Payload/LupinApp.app/
          zip -r ../LupinApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LupinApp-Unsigned
          path: LupinApp.ipa
