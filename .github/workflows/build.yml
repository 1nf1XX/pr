name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen & ImageMagick
        run: brew install xcodegen imagemagick

      - name: Prepare Sources & Icon
        run: |
          mkdir -p Sources
          mv *.swift Sources/ContentView.swift || true

          if ! grep -q "@main" Sources/ContentView.swift; then
            cat << 'EOF' >> Sources/ContentView.swift
          import SwiftUI

          @main
          struct LupinAppLauncher: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF
          fi

          # Конвертируем иконку, если она загружена в репозиторий
          if [ -f "icon.png" ]; then
            mkdir -p Assets.xcassets/AppIcon.appiconset
            magick icon.png -resize 1024x1024 Assets.xcassets/AppIcon.appiconset/icon_1024.png
            
            cat << 'EOF' > Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images": [
              {
                "filename": "icon_1024.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF
          fi

          cat << 'EOF' > project.yml
          name: LupinApp
          options:
            bundleIdPrefix: com.lupin
            deploymentTarget:
              iOS: "16.0"
            xcodeVersion: "15.4"
            generateEmptyDirectories: true
          targets:
            LupinApp:
              type: application
              platform: iOS
              sources: 
                - Sources
                - Assets.xcassets
              info:
                path: Info.plist
                properties:
                  CFBundleIdentifier: com.lupin.app
                  CFBundleName: LupinApp
                  CFBundleExecutable: LupinApp
                  CFBundlePackageType: APPL
                  CFBundleShortVersionString: "1.0"
                  CFBundleVersion: "1"
                  UILaunchScreen: {}
                  NSSpeechRecognitionUsageDescription: "Разреши доступ для распознавания твоих команд"
                  NSMicrophoneUsageDescription: "Разреши микрофон, чтобы ассистент мог тебя слышать"
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.lupin.app
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGNING_REQUIRED: NO
                DEVELOPMENT_TEAM: ""
                PROVISIONING_PROFILE_SPECIFIER: ""
                ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          EOF

          xcodegen generate --spec project.yml
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' LupinApp.xcodeproj/project.pbxproj || true

      - name: Build App with Xcodebuild
        run: |
          xcodebuild -project LupinApp.xcodeproj \
            -scheme LupinApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/LupinApp.app Payload/
          zip -r LupinApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LupinApp-Unsigned
          path: LupinApp.ipa
