name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Setup Package File
        run: |
          cat << 'EOF' > Package.swift
          // swift-tools-version:5.9
          import PackageDescription

          let package = Package(
              name: "LupinApp",
              platforms: [.iOS(.v16)],
              products: [.library(name: "LupinApp", targets: ["LupinApp"])],
              targets: [.target(name: "LupinApp", path: ".")]
          )
          EOF

      - name: Compile App
        run: |
          swift build -c release --triple arm64-apple-ios16.0
          mkdir -p Payload/LupinApp.app
          cp -r .build/arm64-apple-ios16.0/release/LupinApp Payload/LupinApp.app/ 2>/dev/null || true
          zip -r LupinApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LupinApp-Unsigned
          path: LupinApp.ipa
