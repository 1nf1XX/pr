name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Create Xcode Project & Build
        run: |
          mkdir -p LupinApp
          mv *.swift LupinApp/main.swift
          
          # Создаем проект через swift package
          cd LupinApp
          swift package init --type executable
          rm -rf Sources/LupinApp/main.swift
          mv main.swift Sources/LupinApp/main.swift
          
          # Сборка через нативный xcodebuild под iOS
          xcodebuild -scheme LupinApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/LupinApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

          # Упаковка в .ipa
          mkdir -p Payload
          cp -r build/LupinApp.xcarchive/Products/usr/local/bin/LupinApp Payload/ 2>/dev/null || cp -r build/LupinApp.xcarchive/Products/Applications/*.app Payload/ 2>/dev/null || true
          zip -r ../LupinApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LupinApp-Unsigned
          path: LupinApp.ipa
